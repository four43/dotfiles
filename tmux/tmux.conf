### PLUGINS ###
set -g @plugin 'hallazzang/tmux-reset'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'o0th/tmux-nova'

### GENERAL ###
set -g default-terminal "screen-256color"
set -g default-shell /usr/bin/zsh

set -sg escape-time 0
set -g history-limit 20000

set -g focus-events on

set -g repeat-time 0

# Window name comes from the pane title (set via OSC 2 escape sequences, which
# pass through docker exec/ssh), not from programs renaming the window directly.
# Claude Code titles are "<spinner> <conversation title>": strip the spinner,
# cut back to the last whole word within 22 chars (hard cut only if a single
# word is longer). When the title is empty (Claude clears it on exit) or still
# tmux's default hostname, fall back to the current directory's name.
# A manual rename-window still sticks for that window.
# Regex limits: no [:alnum:] (tmux reads its ':' as the end of the modifier) and
# no .{1,22} (its '}' closes the format), hence the spelled-out '.?' run.
setw -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{&&:#{s/^[^a-zA-Z0-9]+ *//:pane_title},#{!=:#{pane_title},#{host}}},#{=22:#{s/^(..?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?)( .*)?$/\1/:#{s/^[^a-zA-Z0-9]+ *//:pane_title}}},#{b:pane_current_path}}'

# Forward terminal bells (\a) from any window to the parent terminal and flag
# the window, so Claude Code's terminal_bell notification marks who needs you.
set -g bell-action any
set -g visual-bell off
setw -g monitor-bell on

# Set parent terminal title to reflect current session and window
set -g set-titles on
set -g set-titles-string "#S · #W"

# From Claude Code's tmux docs (notifications + Shift+Enter)
setw -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'alacritty*:extkeys'

# Enable mouse support
set -g mouse on

# ----------
# Navigation
# ----------

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind c new-window -c '#{pane_current_path}'

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"


# Enable mouse control (clickable windows, panes, resizable panes)
# set -g mouse on

# Order indexes like our keyboard
set -g base-index 1
set -g pane-base-index 1

bind k kill-pane -a

set-option -g renumber-windows on

### COLORS ###
b_bg="#454b50"

seg_a="#84a0a8 #282828"
seg_b="$b_bg #ddc7a1"

inactive_bg="#4c566a"
inactive_fg="#d8dee9"
active_bg="#89c0d0"
active_fg="#2e3540"

set -gw window-status-current-style bold
set -g "@nova-status-style-bg" "$inactive_bg"
set -g "@nova-status-style-fg" "$inactive_fg"
set -g "@nova-status-style-active-bg" "$active_bg"
set -g "@nova-status-style-active-fg" "$active_fg"

set -g "@nova-pane-active-border-style" "#44475a"
set -g "@nova-pane-border-style" "#282a36"

set -g "@nova-status-style-double-bg" "$inactive_bg"

### THEME ###
set -g @nova-nerdfonts false
set -g @nova-nerdfonts-left " "
set -g @nova-nerdfonts-right " "

# Claude Code state marker, set per window by claude/hooks/tmux-state.sh:
# ● while working, ✋ when waiting on a permission prompt, nothing when idle.
set -g @nova-pane "#I. #{?#{==:#{@claude_state},working},● ,}#{?#{==:#{@claude_state},waiting},✋ ,}#W"
set -g @nova-rows 1
set -g status 'on'

### STATUS BAR ###

# Row 0 - Left
set -g @nova-segment-session "#{?client_prefix,\uf096,\uf0c8} #{session_name}"
set -g @nova-segment-session-colors "$seg_a"

set -g @nova-segments-0-left "session"

# Row 0 - Right

# Row 1 - Left
set -g @nova-segment-awvpn "#(~/.dotfiles/tmux/aw-vpn-status.sh)"
set -g @nova-segment-awvpn-colors "$seg_b"

# Always show this machine's hostname; when the tmux server was started over
# SSH, label it REMOTE in orange so it's never mistaken for a local session.
set -g @nova-segment-host "#h"
set -g @nova-segment-host-colors "$seg_a"
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g @nova-segment-host "REMOTE · #h"; set -g @nova-segment-host-colors "#d08770 #282828"'

# Row 1 - Right

set -g @nova-segment-whoami "#(whoami)@#h"
set -g @nova-segment-whoami-colors "$seg_a"

set -g @cpu_percentage_format "%3.1f%%"
set -g @nova-segment-cpu "\uf4bc #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) \ue266 #(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh)"
set -g @nova-segment-cpu-colors "$seg_a"

set -g @nova-segment-sensu "#(~/.dotfiles/tmux/sensu-summary.sh)"
set -g @nova-segment-sensu-colors "$seg_b"

# Segment config
set -g @nova-segments-0-left "session"
set -g @nova-segments-0-right ""

set -g @nova-segments-1-left "host awvpn"
set -g @nova-segments-1-right "cpu sensu whoami"

# Initialize TMUX plugin manager (keep this at the very bottom of tmux.conf).
# Arch: AUR package path. Elsewhere: a git clone in ~/.tmux/plugins/tpm.
if-shell '[ -x /usr/share/tmux-plugin-manager/tpm ]' \
  "run '/usr/share/tmux-plugin-manager/tpm'" \
  "run '~/.tmux/plugins/tpm/tpm'"
