# Xweather S3 access point used by work projects and the devcontainers VS Code
# spawns. Not a credential -- just a resource identifier -- so it lives here in
# the clear rather than in `pass`. Actual secrets go through bin/code-with-secrets.
#
# environment.d reaches systemd user units, dbus-activated apps and the KDE
# graphical session. Interactive SSH shells do NOT read it; those pick the var
# up from ~/.zshenv.secret via zsh/zshenv.
XWE_ACCESS_POINT=arn:aws:s3:us-east-1:104707020524:accesspoint/xwe-data-dev-primary-daas
